[project]
name = "lost-in-handoff"
version = "0.1.0"
description = "Constraint loss and error propagation in tool-using multi-agent systems (Group 14)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "tau2",
    "langgraph>=0.6",
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
    "pydantic>=2",
    "typer>=0.12",
    "pandas>=2.2",
    "audioop-lts; python_version >= '3.13'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.uv.sources]
tau2 = { path = "vendor/tau2-bench", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handoff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
